<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#0f352e"/>
      <stop offset="1" stop-color="#061412"/>
    </radialGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Outer emerald ring -->
  <circle cx="512" cy="512" r="418" fill="none" stroke="url(#emerald)" stroke-opacity="0.35" stroke-width="8"/>
  <!-- Rub el Hizb (Ottoman 8-pointed star in Emerald & Gold) -->
  <g transform="translate(512 512)">
    <rect x="-245" y="-245" width="490" height="490" rx="32" fill="#09221e" fill-opacity="0.7" stroke="url(#emerald)" stroke-width="26" stroke-linejoin="round"/>
    <rect x="-245" y="-245" width="490" height="490" rx="32" transform="rotate(45)" fill="#071b18" fill-opacity="0.92" stroke="url(#gold)" stroke-width="26" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="192" fill="none" stroke="url(#emerald)" stroke-opacity="0.4" stroke-width="6"/>
  </g>
  <!-- Stylized 'h.' emblem of hıfz. -->
  <path d="M396 644V356h68v104c56-56 172-36 172 68v116h-68V532c0-54-104-46-104 14v98Z" fill="url(#gold)"/>
  <circle cx="676" cy="612" r="34" fill="#34d399"/>
</svg>
